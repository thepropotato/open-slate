name: Submit a slate
description: Share a layout you have built for the gallery
labels: ['slate']
body:
  - type: markdown
    attributes:
      value: >
        A slate is the arrangement of your widgets - which ones are on the grid
        and where they sit. It carries none of your content: not the calendar
        you subscribe to, not the city your weather is set to, not your tiles or
        notes. Whoever applies it points the widgets at their own.


        The easiest way to fill this in is from the extension itself: open
        Settings, go to Widgets, and press **Share this layout**. That brings you
        here with the code already in place.

  - type: input
    id: name
    attributes:
      label: Name
      description: A few words. "Focus", "Two columns", "Everything at once".
      placeholder: Focus
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: What it is for
      description: One sentence, so someone browsing knows whether it suits them.
      placeholder: A clock, the day ahead, and somewhere to put what you are doing.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: The slate code
      description: >
        The `ns1.` code from Settings → Widgets → Copy this layout. Paste it
        exactly as it was copied.
      placeholder: ns1.…
      render: text
    validations:
      required: true

  - type: input
    id: credit
    attributes:
      label: Name to credit (optional)
      description: >
        Leave this empty to be credited as your GitHub username. Fill it in to be
        shown under a name you prefer instead; your username is still displayed
        alongside, because that is the part that was checked.
      placeholder: Ada Lovelace
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: >
            I built this layout, and I am happy for it to be published in the
            gallery under the project's licence with my GitHub username credited.
          required: true

  - type: markdown
    attributes:
      value: >
        You are not asked for your username: the slate is credited to the account
        that files this, which is one thing nobody can type in on your behalf. If
        you are sharing someone else's layout, say whose in a comment so they can
        be credited instead.


        You are not asked for an email either, and please do not put one in. The
        gallery is a folder of files in a public repository and its history is
        permanent, so an address added there could never be taken back out.
        Replying to this issue reaches you already.
